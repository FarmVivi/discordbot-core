sonar.projectKey=FarmVivi_discordbot-core
sonar.organization=farmvivi

# Multi-module configuration
# API Module
discordbot-api.sonar.sources=discordbot-api/src/main/java
discordbot-api.sonar.java.binaries=discordbot-api/target/classes

# Core Module  
discordbot-core.sonar.sources=discordbot-core/src/main/java
discordbot-core.sonar.java.binaries=discordbot-core/target/classes

# Example Audio Module
discordbot-example-audio.sonar.sources=examples/plugins/plugin-example-audio/src/main/java
discordbot-example-audio.sonar.java.binaries=examples/plugins/plugin-example-audio/target/classes

# Example Commands Module
discordbot-example-commands.sonar.sources=examples/plugins/plugin-example-commands/src/main/java
discordbot-example-commands.sonar.java.binaries=examples/plugins/plugin-example-commands/target/classes

# Plugin Template Module
discordbot-plugin-template.sonar.sources=examples/plugins/plugin-template/src/main/java
discordbot-plugin-template.sonar.java.binaries=examples/plugins/plugin-template/target/classes

# Encodage du code source
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/target/**,**/bin/**

# Version de Java
sonar.java.source=17
