template:
  messages:
    plugin_enabled: "Template Plugin enabled!"
    plugin_disabled: "Template Plugin disabled!"
    example_message: "Hello from Template Plugin!"
    welcome_user: "Welcome, {user}!"

  commands:
    # Basic commands
    info:
      description: "Show plugin information"
      status: "Status: Active"
    
    config:
      description: "Manage plugin configuration"
      reloaded: "✅ Configuration reloaded!"
      set:
        description: "Set configuration value"
    
    # Demo commands
    demo:
      description: "Demonstrate various option types"
    
    category:
      description: "Select a category with autocomplete"
    
    # Data commands
    profile:
      description: "Manage your profile"
      view: "View your profile"
      nickname: "Set your nickname"
    
    file:
      description: "File storage operations"
      save: "Save text to file"
      list: "List your saved files"
    
    # Audio commands
    audio:
      description: "Audio system demonstration"

  # Permission descriptions
  permissions:
    use:
      description: "Allows usage of basic template features"
    admin:
      description: "Allows administrative template actions"
    advanced:
      description: "Allows access to advanced features"

  # Feature status messages
  features:
    welcome_enabled: "✅ Welcome messages enabled"
    welcome_disabled: "❌ Welcome messages disabled"
    data_storage_enabled: "✅ Data storage enabled"
    data_storage_disabled: "❌ Data storage disabled"
    audio_enabled: "✅ Audio features enabled"
    audio_disabled: "❌ Audio features disabled"

  # User interface messages
  ui:
    profile_title: "👤 **{user}'s Profile**"
    statistics_title: "📊 **Statistics**"
    file_saved: "💾 File saved: **{filename}**"
    file_list_title: "📁 **Your files:**"
    no_files: "📁 No files found."
    
  # System messages
  system:
    data_cleanup: "🧹 Data cleanup completed"
    statistics_updated: "📊 Statistics updated"
    backup_completed: "💾 Backup completed"

  errors:
    no_permission: "❌ You don't have permission to use this command"
    invalid_usage: "❌ Invalid command usage"
    config_error: "❌ Configuration error: {error}"
    file_save_error: "❌ Failed to save file: {error}"
    file_list_error: "❌ Failed to list files: {error}"
    guild_only: "❌ This command can only be used in a server"
    feature_disabled: "❌ This feature is disabled"
    rate_limited: "⏰ Please wait before using this command again"