version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fluxcord-app
    restart: unless-stopped
    ports:
      # Expose health/readiness HTTP endpoint from the core (see HEALTH_PORT)
      - "8081:8081"
    volumes:
      # Mount for application data persistence
      - ./data:/app/data
      - ./plugins:/app/plugins
      # Persist application logs on host
      - ./logs:/app/logs
      # If you maintain a custom config at repo root, bind it here. Ensure the file exists.
      #- ./config.yml:/app/config.yml
    environment:
      # JVM options (adjust memory as needed)
      - JAVA_OPTS=-Xmx1G
      # Discord bot token override for core config (env-aware key: discord.token)
      - FLUXCORD_DISCORD_TOKEN=${FLUXCORD_DISCORD_TOKEN:-}
      # Plugin installation & updates managed by entrypoint.sh
      - INSTALL_PLUGINS=*
      - INSTALL_EXAMPLES=false
      - AUTO_UPDATE_PLUGINS=true
      # Health HTTP port exposed by the core
      - HEALTH_PORT=8081
