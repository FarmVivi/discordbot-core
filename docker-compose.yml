version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mount for local development (uncomment when developing)
      # Multi-module structure: mount individual modules
      #- ./discordbot-api/src:/app/discordbot-api/src
      #- ./discordbot-core/src:/app/discordbot-core/src  
      # Mount for application data persistence
      - ./data:/app/data
      - ./plugins:/app/plugins
      - ./config.yml:/app/config.yml
    environment:
      - JAVA_OPTS=-Xmx1G
      # Variables de configuration (exemples):
      # - DISCORD_TOKEN=your_token_here
      # - INSTALL_PLUGINS=music-plugin,ai-audio-plugin   # ou '*' pour tous les bundles disponibles
      # - INSTALL_EXAMPLES=false                         # true pour autoriser l'installation des exemples
      # - AUTO_UPDATE_PLUGINS=true                       # met à jour automatiquement si une version plus récente est packagée
      # - HEALTH_PORT=8081                               # port du serveur HTTP de santé (/healthz, /readyz)
